services:
  chankas:
    build: .
    image: chankas:latest
    container_name: chankas
    environment:
      FRAME_ANCESTORS: "'self'"
    restart: unless-stopped
    networks:
      - traefik-public
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  traefik-public:
    external: true
