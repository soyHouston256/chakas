services:
  chankas:
    build: .
    image: chankas:latest
    container_name: chankas
    environment:
      FRAME_ANCESTORS: "'self'"
      API_UPSTREAM: "api:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: chankas-api:latest
    container_name: chankas-api
    environment:
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:27017/chankas}"
      MONGODB_DB: "${MONGODB_DB:-chankas}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      TRUST_PROXY: "true"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6

  mongo:
    image: mongo:7.0
    container_name: chankas-mongo
    volumes:
      - chankas-mongo:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  traefik-public:
    external: true

volumes:
  chankas-mongo:
