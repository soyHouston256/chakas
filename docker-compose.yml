services:
  chankas:
    build: .
    image: chankas:latest
    container_name: chankas
    # Solo en localhost: en un VPS, Caddy (u otro proxy con TLS) es quien expone el puerto 443.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FRAME_ANCESTORS: "'self'"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
