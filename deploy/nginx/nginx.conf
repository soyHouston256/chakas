# nginx para CHANKAS (imagen nginxinc/nginx-unprivileged, usuario 101, puerto 8080).
# Todo lo escribible vive en /tmp para poder correr con sistema de archivos de solo lectura.
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/html text/css text/plain application/javascript;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    client_max_body_size 1k;   # sitio estático: no se aceptan cuerpos
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/css text/plain application/javascript image/svg+xml;
    # Brotli no viene compilado en esta imagen; no se añaden módulos.

    # Generado al arrancar desde /etc/nginx/templates (envsubst de FRAME_ANCESTORS).
    include /tmp/conf.d/default.conf;
}
